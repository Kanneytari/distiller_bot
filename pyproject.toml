[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "distiller-bot"
version = "0.1.0"
description = "Telegram bot for home distillers with recipes, calculators, equipment profiles and production tracking."
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.20,<4.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.21,<1.0",
    "pydantic-settings>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["distiller_bot*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
